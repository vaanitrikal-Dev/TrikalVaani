<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img"><style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .draw { stroke-dasharray:1000; stroke-dashoffset:1000;
           animation: dash 1.6s ease-out forwards; }
  .d2 { animation-delay:.3s } .d3 { animation-delay:.6s }
  .d4 { animation-delay:.9s } .d5 { animation-delay:1.2s }
  .d6 { animation-delay:1.5s }
  @keyframes dash { to { stroke-dashoffset:0 } }
  .fade { opacity:0; animation: fade .8s ease-out 1.4s forwards }
  @keyframes fade { to { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .draw { stroke-dashoffset:0 !important; }
    .fade { opacity:1 !important; }
  }
  
</style><rect x="20" y="30" width="220" height="200" rx="14" fill="#0f172a" fill-opacity=".5" stroke="#fb7185" stroke-width="1.5"/><path d="M45 200 C 70 175, 90 155, 100 140" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/><path d="M100 140 C 112 122, 130 118, 145 128" fill="none" stroke="#fb7185" stroke-width="2.6" stroke-linecap="round" class="draw"/><path d="M100 140 C 108 158, 128 158, 145 128" fill="none" stroke="#fb7185" stroke-width="2.6" stroke-linecap="round" class="draw d2"/><path d="M145 128 C 168 112, 190 92, 212 70" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/><circle class="fade" cx="100" cy="140" r="4" fill="#fb7185"/><circle class="fade" cx="145" cy="128" r="4" fill="#fb7185"/><text x="130" y="55" font-size="13" fill="#fb7185" text-anchor="middle" font-weight="700">द्वीप</text><text x="130" y="252" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="500">एक रेखा बँटती है...</text><text x="130" y="268" font-size="11.5" fill="#fb7185" text-anchor="middle" font-weight="600">और फिर एक हो जाती है।</text><text x="130" y="286" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">यह बंद होती है, हमेशा।</text><rect x="280" y="30" width="220" height="200" rx="14" fill="#0f172a" fill-opacity=".5" stroke="#34d399" stroke-width="1.5"/><path d="M305 200 C 330 175, 350 155, 362 142" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/><path d="M362 142 C 385 118, 412 112, 432 122" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" class="draw"/><path d="M366 128 C 392 138, 418 146, 438 152" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" class="draw d2"/><path d="M432 122 L 462 104" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" class="draw d3"/><path d="M438 152 L 466 158" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" class="draw d3"/><circle class="fade" cx="391" cy="132" r="2.6" fill="#34d399"/><text x="390" y="55" font-size="13" fill="#34d399" text-anchor="middle" font-weight="700">मछली</text><text x="390" y="252" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="500">दो रेखाएँ मिलती हैं...</text><text x="390" y="268" font-size="11.5" fill="#34d399" text-anchor="middle" font-weight="600">और पूँछ खुली रहती है।</text><text x="390" y="286" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">यह कभी बंद नहीं होती।</text></svg>