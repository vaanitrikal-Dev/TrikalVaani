<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img"><style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .draw { stroke-dasharray:1000; stroke-dashoffset:1000;
           animation: dash 1.6s ease-out forwards; }
  .d2 { animation-delay:.3s } .d3 { animation-delay:.6s }
  .d4 { animation-delay:.9s } .d5 { animation-delay:1.2s }
  .d6 { animation-delay:1.5s }
  @keyframes dash { to { stroke-dashoffset:0 } }
  .fade { opacity:0; animation: fade .8s ease-out 1.4s forwards }
  @keyframes fade { to { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .draw { stroke-dashoffset:0 !important; }
    .fade { opacity:1 !important; }
  }
  
</style><g class="fade" stroke="#94a3b8" stroke-width="1.6" fill="#0f172a" fill-opacity=".35"><rect x="90" y="60" width="58" height="70" rx="26"/><rect x="90" y="130" width="58" height="80" rx="14"/><path d="M90 210 q29 40 58 0" /></g><line class="fade" x1="82" y1="130" x2="156" y2="130" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3"/><text x="180" y="90" font-size="12" fill="#34d399" text-anchor="start" font-weight="700">1st phalange — WILL</text><text x="180" y="108" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">the drive to decide and act</text><text x="180" y="170" font-size="12" fill="#fbbf24" text-anchor="start" font-weight="700">2nd phalange — LOGIC</text><text x="180" y="188" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">the reasoning behind it</text><text x="180" y="232" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">Will dominates → fast, often wrong, moves again.</text><text x="180" y="248" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">Logic dominates → analyses beautifully, does nothing.</text><text x="180" y="264" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="600">Balanced → rare. Sound reasoning that becomes movement.</text><text x="260" y="290" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">The lines describe what you have. The thumb decides whether you use it.</text></svg>