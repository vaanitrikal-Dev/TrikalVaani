<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 450" role="img"><style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .draw { stroke-dasharray:1000; stroke-dashoffset:1000;
           animation: dash 1.6s ease-out forwards; }
  .d2 { animation-delay:.3s } .d3 { animation-delay:.6s }
  .d4 { animation-delay:.9s } .d5 { animation-delay:1.2s }
  .d6 { animation-delay:1.5s }
  @keyframes dash { to { stroke-dashoffset:0 } }
  .fade { opacity:0; animation: fade .8s ease-out 1.4s forwards }
  @keyframes fade { to { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .draw { stroke-dashoffset:0 !important; }
    .fade { opacity:1 !important; }
  }
  
</style><g transform="translate(0,0) scale(1.0)"
     stroke="#94a3b8" stroke-width="1.5" fill="#0f172a" fill-opacity=".35"
     stroke-linejoin="round">
  <rect x="90" y="140" width="180" height="230" rx="38"/>
  <rect x="100" y="55"  width="34" height="90"  rx="17"/>
  <rect x="140" y="35"  width="34" height="112" rx="17"/>
  <rect x="180" y="48"  width="34" height="99"  rx="17"/>
  <rect x="220" y="80"  width="30" height="68"  rx="15"/>
  <rect x="46"  y="200" width="32" height="104" rx="16" transform="rotate(-28 62 252)"/>
</g><circle class="fade" cx="117" cy="178" r="21" fill="#fbbf24" fill-opacity=".10" stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="3 3"/><text x="117" y="212" font-size="9.5" fill="#94a3b8" text-anchor="middle" font-weight="500">Guru</text><circle class="fade" cx="157" cy="172" r="21" fill="#fbbf24" fill-opacity=".10" stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="3 3"/><text x="157" y="206" font-size="9.5" fill="#94a3b8" text-anchor="middle" font-weight="500">Shani</text><circle class="fade" cx="197" cy="178" r="21" fill="#fbbf24" fill-opacity=".10" stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="3 3"/><text x="197" y="212" font-size="9.5" fill="#94a3b8" text-anchor="middle" font-weight="500">Surya</text><circle class="fade" cx="236" cy="190" r="21" fill="#fbbf24" fill-opacity=".10" stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="3 3"/><text x="236" y="224" font-size="9.5" fill="#94a3b8" text-anchor="middle" font-weight="500">Budh</text><circle class="fade" cx="117" cy="178" r="4" fill="#475569"/><circle class="fade" cx="133" cy="175" r="5.5" fill="#34d399"/><path class="fade" d="M121 177 L 128 176" stroke="#34d399" stroke-width="1.6"/><path class="fade" d="M126 178 L 129 175 L 126 173" fill="none" stroke="#34d399" stroke-width="1.4"/><g class="fade"><text x="300" y="200" font-size="12" fill="#e2e8f0" text-anchor="start" font-weight="700">DISPLACEMENT</text><text x="300" y="218" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">The apex of a mount</text><text x="300" y="230" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">is not always centred.</text><text x="300" y="254" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">It LEANS — and the lean</text><text x="300" y="266" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">tells you what the quality</text><text x="300" y="278" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">is being pulled toward.</text><text x="300" y="306" font-size="10" fill="#34d399" text-anchor="start" font-weight="600">Guru leaning to Shani =</text><text x="300" y="318" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">ambition disciplined</text><text x="300" y="330" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">by patience.</text><text x="215" y="404" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="600">A displaced mount is not a flaw.</text><text x="215" y="420" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="500">It is a fusion of two planets — and it explains</text><text x="215" y="434" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="500">the people who fit none of the clean types.</text></g></svg>