<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img"><style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .draw { stroke-dasharray:1000; stroke-dashoffset:1000;
           animation: dash 1.6s ease-out forwards; }
  .d2 { animation-delay:.3s } .d3 { animation-delay:.6s }
  .d4 { animation-delay:.9s } .d5 { animation-delay:1.2s }
  .d6 { animation-delay:1.5s }
  @keyframes dash { to { stroke-dashoffset:0 } }
  .fade { opacity:0; animation: fade .8s ease-out 1.4s forwards }
  @keyframes fade { to { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .draw { stroke-dashoffset:0 !important; }
    .fade { opacity:1 !important; }
  }
  
</style><line x1="60" y1="300" x2="480" y2="300" stroke="#475569" stroke-width="1.5"/><line x1="270" y1="40" x2="270" y2="320" stroke="#475569" stroke-width="1.5"/><text x="270" y="338" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="500">FATE LINE  →  structure of the work</text><text x="26" y="170" font-size="11" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 26 170)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">SUN LINE  →  recognition</text><rect class="fade" x="285" y="55" width="190" height="110" rx="10" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-width="1.5"/><text x="380.0" y="85" font-size="12" fill="#34d399" text-anchor="middle" font-weight="700">SEEN &amp; SOLID</text><text x="380.0" y="105" font-size="10.5" fill="#e2e8f0" text-anchor="middle" font-weight="500">Strong fate + strong sun</text><text x="380.0" y="120" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">reputation matches the work</text><rect class="fade" x="70" y="55" width="185" height="110" rx="10" fill="#fbbf24" fill-opacity=".10" stroke="#fbbf24" stroke-width="1.5"/><text x="162.5" y="85" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="700">VISIBLE, HOLLOW</text><text x="162.5" y="105" font-size="10.5" fill="#e2e8f0" text-anchor="middle" font-weight="500">Sun, no fate</text><text x="162.5" y="120" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">known and broke</text><rect class="fade" x="285" y="185" width="190" height="105" rx="10" fill="#fb7185" fill-opacity=".10" stroke="#fb7185" stroke-width="1.5"/><text x="380.0" y="215" font-size="12" fill="#fb7185" text-anchor="middle" font-weight="700">INVISIBLE WORKHORSE</text><text x="380.0" y="235" font-size="10.5" fill="#e2e8f0" text-anchor="middle" font-weight="500">Strong fate, NO sun</text><text x="380.0" y="250" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">excellent work, no credit</text><rect class="fade" x="70" y="185" width="185" height="105" rx="10" fill="#94a3b8" fill-opacity=".10" stroke="#94a3b8" stroke-width="1.5"/><text x="162.5" y="215" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="700">NEITHER YET</text><text x="162.5" y="235" font-size="10.5" fill="#e2e8f0" text-anchor="middle" font-weight="500">Weak fate, weak sun</text><text x="162.5" y="250" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">structure comes first</text><text x="380" y="308" font-size="10" fill="#fb7185" text-anchor="middle" font-weight="600">working harder will not fix this</text></svg>