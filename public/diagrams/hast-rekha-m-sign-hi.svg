<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 450" role="img"><style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .draw { stroke-dasharray:1000; stroke-dashoffset:1000;
           animation: dash 1.6s ease-out forwards; }
  .d2 { animation-delay:.3s } .d3 { animation-delay:.6s }
  .d4 { animation-delay:.9s } .d5 { animation-delay:1.2s }
  .d6 { animation-delay:1.5s }
  @keyframes dash { to { stroke-dashoffset:0 } }
  .fade { opacity:0; animation: fade .8s ease-out 1.4s forwards }
  @keyframes fade { to { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .draw { stroke-dashoffset:0 !important; }
    .fade { opacity:1 !important; }
  }
  
</style><g transform="translate(0,0) scale(1.0)"
     stroke="#94a3b8" stroke-width="1.5" fill="#0f172a" fill-opacity=".35"
     stroke-linejoin="round">
  <rect x="90" y="140" width="180" height="230" rx="38"/>
  <rect x="100" y="55"  width="34" height="90"  rx="17"/>
  <rect x="140" y="35"  width="34" height="112" rx="17"/>
  <rect x="180" y="48"  width="34" height="99"  rx="17"/>
  <rect x="220" y="80"  width="30" height="68"  rx="15"/>
  <rect x="46"  y="200" width="32" height="104" rx="16" transform="rotate(-28 62 252)"/>
</g><path d="M250 192 C 212 166, 160 156, 112 168" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" class="draw"/><path d="M100 206 C 142 216, 196 224, 242 240" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" class="draw d2"/><path d="M100 198 C 106 252, 120 312, 152 366" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" class="draw d3"/><path d="M172 366 C 170 300, 168 240, 166 196" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" class="draw d4"/><path class="fade" d="M112 168 L 166 196 L 100 206" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="4 3"/><g class="fade"><text x="300" y="230" font-size="12" fill="#fbbf24" text-anchor="start" font-weight="700">'M' का निशान</text><text x="300" y="250" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">हृदय रेखा + मस्तिष्क रेखा</text><text x="300" y="263" font-size="10.5" fill="#fbbf24" text-anchor="start" font-weight="600">+ जीवन रेखा + भाग्य रेखा</text><text x="300" y="282" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">M तभी बनता है जब</text><text x="300" y="294" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">एक स्पष्ट भाग्य रेखा</text><text x="300" y="306" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">बाक़ी तीन को काटती है।</text><text x="215" y="404" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700">M दुर्लभ नहीं है।</text><text x="215" y="420" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="500">यह अक्षर पहने एक रेखा-कहानी है।</text></g></svg>