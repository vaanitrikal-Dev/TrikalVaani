<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 450" role="img"><style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .draw { stroke-dasharray:1000; stroke-dashoffset:1000;
           animation: dash 1.6s ease-out forwards; }
  .d2 { animation-delay:.3s } .d3 { animation-delay:.6s }
  .d4 { animation-delay:.9s } .d5 { animation-delay:1.2s }
  .d6 { animation-delay:1.5s }
  @keyframes dash { to { stroke-dashoffset:0 } }
  .fade { opacity:0; animation: fade .8s ease-out 1.4s forwards }
  @keyframes fade { to { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .draw { stroke-dashoffset:0 !important; }
    .fade { opacity:1 !important; }
  }
  
</style><g transform="translate(0,0) scale(1.0)"
     stroke="#94a3b8" stroke-width="1.5" fill="#0f172a" fill-opacity=".35"
     stroke-linejoin="round">
  <rect x="90" y="140" width="180" height="230" rx="38"/>
  <rect x="100" y="55"  width="34" height="90"  rx="17"/>
  <rect x="140" y="35"  width="34" height="112" rx="17"/>
  <rect x="180" y="48"  width="34" height="99"  rx="17"/>
  <rect x="220" y="80"  width="30" height="68"  rx="15"/>
  <rect x="46"  y="200" width="32" height="104" rx="16" transform="rotate(-28 62 252)"/>
</g><path d="M262 200 C 276 196, 292 190, 306 182" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" class="draw"/><path d="M262 214 C 280 214, 298 214, 314 214" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" class="draw d2"/><path d="M262 228 C 278 232, 294 240, 308 250" fill="none" stroke="#fb7185" stroke-width="2.6" stroke-linecap="round" class="draw d3"/><g class="fade"><rect x="300" y="290" width="10" height="3" fill="#34d399"/><text x="316" y="296" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">Curves UP — the bond lifted you</text><rect x="300" y="312" width="10" height="3" fill="#fbbf24"/><text x="316" y="318" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">LEVEL — the steady marriage</text><rect x="300" y="334" width="10" height="3" fill="#fb7185"/><text x="316" y="340" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">Curves DOWN — it cost you</text><text x="316" y="352" font-size="10" fill="#fb7185" text-anchor="start" font-weight="500">something. NOT divorce.</text><text x="300" y="272" font-size="12" fill="#e2e8f0" text-anchor="start" font-weight="700">DIRECTION</text><text x="215" y="404" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="600">Counting the lines tells you nothing.</text><text x="215" y="420" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="500">They record bonds, not weddings.</text><text x="215" y="436" font-size="10.5" fill="#fb7185" text-anchor="middle" font-weight="600">And no palm carries a wedding date.</text></g></svg>