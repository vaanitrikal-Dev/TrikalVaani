<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 450" role="img"><style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .draw { stroke-dasharray:1000; stroke-dashoffset:1000;
           animation: dash 1.6s ease-out forwards; }
  .d2 { animation-delay:.3s } .d3 { animation-delay:.6s }
  .d4 { animation-delay:.9s } .d5 { animation-delay:1.2s }
  .d6 { animation-delay:1.5s }
  @keyframes dash { to { stroke-dashoffset:0 } }
  .fade { opacity:0; animation: fade .8s ease-out 1.4s forwards }
  @keyframes fade { to { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .draw { stroke-dashoffset:0 !important; }
    .fade { opacity:1 !important; }
  }
  
</style><g transform="translate(0,0) scale(1.0)"
     stroke="#94a3b8" stroke-width="1.5" fill="#0f172a" fill-opacity=".35"
     stroke-linejoin="round">
  <rect x="90" y="140" width="180" height="230" rx="38"/>
  <rect x="100" y="55"  width="34" height="90"  rx="17"/>
  <rect x="140" y="35"  width="34" height="112" rx="17"/>
  <rect x="180" y="48"  width="34" height="99"  rx="17"/>
  <rect x="220" y="80"  width="30" height="68"  rx="15"/>
  <rect x="46"  y="200" width="32" height="104" rx="16" transform="rotate(-28 62 252)"/>
</g><path d="M100 206 C 150 212, 200 214, 250 214" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" class="draw"/><path d="M100 206 C 145 222, 195 248, 238 282" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" class="draw d2"/><path d="M100 206 C 138 236, 168 286, 190 330" fill="none" stroke="#fb7185" stroke-width="2.6" stroke-linecap="round" class="draw d3"/><circle class="fade" cx="240" cy="300" r="30" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.3"/><g class="fade"><text x="240" y="304" font-size="10" fill="#fb7185" text-anchor="middle" font-weight="500">Chandra</text><text x="240" y="316" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="500">Parvat</text><text x="300" y="200" font-size="12" fill="#e2e8f0" text-anchor="start" font-weight="700">THE SLOPE</text><rect x="300" y="214" width="10" height="3" fill="#34d399"/><text x="316" y="220" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">Straight — analytical,</text><text x="316" y="232" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">sequential, evidence-first</text><rect x="300" y="252" width="10" height="3" fill="#fbbf24"/><text x="316" y="258" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">Sloping — associative,</text><text x="316" y="270" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">lateral, leaps to the answer</text><rect x="300" y="290" width="10" height="3" fill="#fb7185"/><text x="316" y="296" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">Steep — lives inside</text><text x="316" y="308" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">the imagination</text><text x="215" y="412" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="600">Length is depth of engagement.</text><text x="215" y="428" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="500">It is not a measure of intelligence.</text></g></svg>