  <rect x="100" y="55"  width="34" height="90"  rx="17"/>
  <rect x="140" y="35"  width="34" height="112" rx="17"/>
  <rect x="180" y="48"  width="34" height="99"  rx="17"/>
  <rect x="220" y="80"  width="30" height="68"  rx="15"/>
  <rect x="46"  y="200" width="32" height="104" rx="16" transform="rotate(-28 62 252)"/>
</g><path d="M250 192 C 214 168, 170 152, 122 152" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" class="draw"/><path d="M250 192 C 216 176, 186 166, 158 162" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" class="draw d2"/><path d="M250 192 C 218 172, 182 158, 140 156" fill="none" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round" class="draw d3"/><path d="M250 205 C 200 200, 150 196, 100 196" fill="none" stroke="#fb7185" stroke-width="2.6" stroke-linecap="round" class="draw d4"/><g class="fade"><circle cx="122" cy="152" r="4" fill="#34d399"/><circle cx="158" cy="162" r="4" fill="#fbbf24"/><text x="300" y="230" font-size="12" fill="#e2e8f0" text-anchor="start" font-weight="700">WHERE IT ENDS</text><rect x="300" y="244" width="10" height="3" fill="#34d399"/><text x="316" y="250" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">Under Guru — the idealist</text><rect x="300" y="264" width="10" height="3" fill="#fbbf24"/><text x="316" y="270" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">Under Shani — the container</text><rect x="300" y="284" width="10" height="3" fill="#94a3b8"/><text x="316" y="290" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">Between — the balanced</text><rect x="300" y="304" width="10" height="3" fill="#fb7185"/><text x="316" y="310" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">Fused with head = joined line</text><text x="215" y="412" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="600">The joined line is a wiring pattern.</text><text x="215" y="428" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="500">It is not a defect and not a diagnosis.</text></g></svg>