<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img"><style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .draw { stroke-dasharray:1000; stroke-dashoffset:1000;
           animation: dash 1.6s ease-out forwards; }
  .d2 { animation-delay:.3s } .d3 { animation-delay:.6s }
  .d4 { animation-delay:.9s } .d5 { animation-delay:1.2s }
  .d6 { animation-delay:1.5s }
  @keyframes dash { to { stroke-dashoffset:0 } }
  .fade { opacity:0; animation: fade .8s ease-out 1.4s forwards }
  @keyframes fade { to { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .draw { stroke-dashoffset:0 !important; }
    .fade { opacity:1 !important; }
  }
  
</style><rect x="20" y="30" width="220" height="180" rx="14" fill="#0f172a" fill-opacity=".5" stroke="#475569" stroke-width="1.5"/><path d="M60 190 C 80 160, 95 135, 105 118" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" class="draw"/><path d="M135 96 C 155 78, 180 60, 200 48" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" class="draw d2"/><line class="fade" x1="105" y1="118" x2="135" y2="96" stroke="#fb7185" stroke-width="1.6" stroke-dasharray="3 3"/><text x="130" y="55" font-size="13" fill="#fb7185" text-anchor="middle" font-weight="700">A BREAK</text><text x="130" y="236" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="500">The line stops. Something happened.</text><rect x="280" y="30" width="220" height="180" rx="14" fill="#0f172a" fill-opacity=".5" stroke="#34d399" stroke-width="1.5"/><path d="M320 190 C 340 160, 355 135, 365 118" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" class="draw"/><path d="M395 96 C 415 78, 440 60, 460 48" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" class="draw d2"/><rect class="draw d3" x="342" y="76" width="76" height="62" fill="none" stroke="#34d399" stroke-width="2.6" transform="rotate(-16 380 107)"/><text x="390" y="55" font-size="13" fill="#34d399" text-anchor="middle" font-weight="700">A SQUARE OVER IT</text><text x="390" y="236" font-size="10.5" fill="#34d399" text-anchor="middle" font-weight="600">The same break — survived.</text><text x="260" y="266" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">A square almost never forms on an undamaged line. It is a healed scar.</text></svg>