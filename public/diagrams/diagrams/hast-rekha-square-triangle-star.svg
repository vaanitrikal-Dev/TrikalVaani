<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img"><style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .draw { stroke-dasharray:1000; stroke-dashoffset:1000;
           animation: dash 1.6s ease-out forwards; }
  .d2 { animation-delay:.3s } .d3 { animation-delay:.6s }
  .d4 { animation-delay:.9s } .d5 { animation-delay:1.2s }
  .d6 { animation-delay:1.5s }
  @keyframes dash { to { stroke-dashoffset:0 } }
  .fade { opacity:0; animation: fade .8s ease-out 1.4s forwards }
  @keyframes fade { to { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .draw { stroke-dashoffset:0 !important; }
    .fade { opacity:1 !important; }
  }
  
</style><circle class="fade" cx="90" cy="95" r="58" fill="#34d399" fill-opacity=".07" stroke="#34d399" stroke-width="1.4"/><text x="90" y="182" font-size="13" fill="#34d399" text-anchor="middle" font-weight="700">SQUARE</text><text x="90" y="200" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">protects</text><circle class="fade" cx="280" cy="95" r="58" fill="#fbbf24" fill-opacity=".07" stroke="#fbbf24" stroke-width="1.4"/><text x="280" y="182" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="700">TRIANGLE</text><text x="280" y="200" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">teaches</text><circle class="fade" cx="470" cy="95" r="58" fill="#fb7185" fill-opacity=".07" stroke="#fb7185" stroke-width="1.4"/><text x="470" y="182" font-size="13" fill="#fb7185" text-anchor="middle" font-weight="700">STAR</text><text x="470" y="200" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">intensifies</text><rect class="draw" x="60" y="65" width="60" height="60" fill="none" stroke="#34d399" stroke-width="2.6"/><path class="draw d2" d="M280 60 L 312 122 L 248 122 Z" fill="none" stroke="#fbbf24" stroke-width="2.6"/><line class="draw d3" x1="440.0" y1="95.0" x2="500.0" y2="95.0" stroke="#fb7185" stroke-width="2"/><line class="draw d3" x1="444.0" y1="80.0" x2="496.0" y2="110.0" stroke="#fb7185" stroke-width="2"/><line class="draw d3" x1="455.0" y1="69.0" x2="485.0" y2="121.0" stroke="#fb7185" stroke-width="2"/><line class="draw d3" x1="470.0" y1="65.0" x2="470.0" y2="125.0" stroke="#fb7185" stroke-width="2"/><line class="draw d3" x1="485.0" y1="69.0" x2="455.0" y2="121.0" stroke="#fb7185" stroke-width="2"/><line class="draw d3" x1="496.0" y1="80.0" x2="444.0" y2="110.0" stroke="#fb7185" stroke-width="2"/><text x="90" y="222" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">forms only OVER damage</text><text x="280" y="222" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">skill you BUILT, not luck</text><text x="470" y="222" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">good on Surya. A shock on Shani.</text><text x="280" y="246" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">They are not interchangeable. Every 'lucky signs' list pretends they are.</text></svg>