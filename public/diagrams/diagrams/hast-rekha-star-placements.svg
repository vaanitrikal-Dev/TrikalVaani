" font-size="10" fill="#fb7185" text-anchor="start" font-weight="600">On SHANI — a SHOCK.</text><text x="318" y="322" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">The texts say so.</text><text x="318" y="334" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">The internet hides it.</text><text x="215" y="404" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="600">A star is intensity, not luck.</text><text x="215" y="420" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="500">Placement decides everything.</text></g></svg>