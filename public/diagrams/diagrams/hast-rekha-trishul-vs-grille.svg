<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img"><style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .draw { stroke-dasharray:1000; stroke-dashoffset:1000;
           animation: dash 1.6s ease-out forwards; }
  .d2 { animation-delay:.3s } .d3 { animation-delay:.6s }
  .d4 { animation-delay:.9s } .d5 { animation-delay:1.2s }
  .d6 { animation-delay:1.5s }
  @keyframes dash { to { stroke-dashoffset:0 } }
  .fade { opacity:0; animation: fade .8s ease-out 1.4s forwards }
  @keyframes fade { to { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .draw { stroke-dashoffset:0 !important; }
    .fade { opacity:1 !important; }
  }
  
</style><rect x="20" y="30" width="220" height="200" rx="14" fill="#0f172a" fill-opacity=".5" stroke="#34d399" stroke-width="1.5"/><path d="M130 210 L 130 150" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" class="draw"/><path d="M130 150 L 100 100" fill="none" stroke="#34d399" stroke-width="2.8" stroke-linecap="round" class="draw d2"/><path d="M130 150 L 130 92" fill="none" stroke="#34d399" stroke-width="2.8" stroke-linecap="round" class="draw d2"/><path d="M130 150 L 160 100" fill="none" stroke="#34d399" stroke-width="2.8" stroke-linecap="round" class="draw d2"/><circle class="fade" cx="130" cy="150" r="4" fill="#34d399"/><text x="130" y="55" font-size="13" fill="#34d399" text-anchor="middle" font-weight="700">TRISHUL</text><text x="130" y="252" font-size="11" fill="#34d399" text-anchor="middle" font-weight="600">ONE stem. EXACTLY THREE prongs.</text><text x="130" y="268" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">A discrete, deliberate figure.</text><text x="130" y="285" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">An amplifier — of whatever it sits on.</text><rect x="280" y="30" width="220" height="200" rx="14" fill="#0f172a" fill-opacity=".5" stroke="#fb7185" stroke-width="1.5"/><line class="fade" x1="320" y1="96" x2="334" y2="196" stroke="#fb7185" stroke-width="1.4" opacity=".85"/><line class="fade" x1="333" y1="96" x2="347" y2="196" stroke="#fb7185" stroke-width="1.4" opacity=".85"/><line class="fade" x1="346" y1="96" x2="360" y2="196" stroke="#fb7185" stroke-width="1.4" opacity=".85"/><line class="fade" x1="359" y1="96" x2="373" y2="196" stroke="#fb7185" stroke-width="1.4" opacity=".85"/><line class="fade" x1="372" y1="96" x2="386" y2="196" stroke="#fb7185" stroke-width="1.4" opacity=".85"/><line class="fade" x1="385" y1="96" x2="399" y2="196" stroke="#fb7185" stroke-width="1.4" opacity=".85"/><line class="fade" x1="312" y1="100" x2="452" y2="110" stroke="#fb7185" stroke-width="1.4" opacity=".85"/><line class="fade" x1="312" y1="117" x2="452" y2="127" stroke="#fb7185" stroke-width="1.4" opacity=".85"/><line class="fade" x1="312" y1="134" x2="452" y2="144" stroke="#fb7185" stroke-width="1.4" opacity=".85"/><line class="fade" x1="312" y1="151" x2="452" y2="161" stroke="#fb7185" stroke-width="1.4" opacity=".85"/><line class="fade" x1="312" y1="168" x2="452" y2="178" stroke="#fb7185" stroke-width="1.4" opacity=".85"/><line class="fade" x1="312" y1="185" x2="452" y2="195" stroke="#fb7185" stroke-width="1.4" opacity=".85"/><text x="390" y="55" font-size="13" fill="#fb7185" text-anchor="middle" font-weight="700">GRILLE (JAAL)</text><text x="390" y="252" font-size="11" fill="#fb7185" text-anchor="middle" font-weight="600">A MESH. No stem, no count, no edge.</text><text x="390" y="268" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">A texture, not a figure.</text><text x="390" y="285" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">Energy scattering — the opposite.</text></svg>