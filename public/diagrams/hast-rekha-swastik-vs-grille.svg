<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img"><style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .draw { stroke-dasharray:1000; stroke-dashoffset:1000;
           animation: dash 1.6s ease-out forwards; }
  .d2 { animation-delay:.3s } .d3 { animation-delay:.6s }
  .d4 { animation-delay:.9s } .d5 { animation-delay:1.2s }
  .d6 { animation-delay:1.5s }
  @keyframes dash { to { stroke-dashoffset:0 } }
  .fade { opacity:0; animation: fade .8s ease-out 1.4s forwards }
  @keyframes fade { to { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .draw { stroke-dashoffset:0 !important; }
    .fade { opacity:1 !important; }
  }
  
</style><rect x="20" y="30" width="220" height="200" rx="14" fill="#0f172a" fill-opacity=".5" stroke="#34d399" stroke-width="1.5"/><g class="draw"><line x1="130" y1="90" x2="130" y2="180" stroke="#34d399" stroke-width="2.8"/><line x1="85" y1="135" x2="175" y2="135" stroke="#34d399" stroke-width="2.8"/><line x1="130" y1="90" x2="160" y2="90" stroke="#34d399" stroke-width="2.8"/><line x1="130" y1="180" x2="100" y2="180" stroke="#34d399" stroke-width="2.8"/><line x1="85" y1="135" x2="85" y2="105" stroke="#34d399" stroke-width="2.8"/><line x1="175" y1="135" x2="175" y2="165" stroke="#34d399" stroke-width="2.8"/></g><text x="130" y="55" font-size="13" fill="#34d399" text-anchor="middle" font-weight="700">A REAL SWASTIK</text><text x="130" y="254" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="500">Four symmetrical arms,</text><text x="130" y="270" font-size="10.5" fill="#34d399" text-anchor="middle" font-weight="600">bent at right angles.</text><text x="130" y="288" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">Unmistakable. You do not squint.</text><rect x="280" y="30" width="220" height="200" rx="14" fill="#0f172a" fill-opacity=".5" stroke="#fb7185" stroke-width="1.5"/><line class="fade" x1="316" y1="88" x2="326" y2="188" stroke="#fb7185" stroke-width="1.3" opacity=".85"/><line class="fade" x1="328" y1="88" x2="338" y2="188" stroke="#fb7185" stroke-width="1.3" opacity=".85"/><line class="fade" x1="340" y1="88" x2="350" y2="188" stroke="#fb7185" stroke-width="1.3" opacity=".85"/><line class="fade" x1="352" y1="88" x2="362" y2="188" stroke="#fb7185" stroke-width="1.3" opacity=".85"/><line class="fade" x1="364" y1="88" x2="374" y2="188" stroke="#fb7185" stroke-width="1.3" opacity=".85"/><line class="fade" x1="376" y1="88" x2="386" y2="188" stroke="#fb7185" stroke-width="1.3" opacity=".85"/><line class="fade" x1="388" y1="88" x2="398" y2="188" stroke="#fb7185" stroke-width="1.3" opacity=".85"/><line class="fade" x1="310" y1="94" x2="450" y2="102" stroke="#fb7185" stroke-width="1.3" opacity=".85"/><line class="fade" x1="310" y1="111" x2="450" y2="119" stroke="#fb7185" stroke-width="1.3" opacity=".85"/><line class="fade" x1="310" y1="128" x2="450" y2="136" stroke="#fb7185" stroke-width="1.3" opacity=".85"/><line class="fade" x1="310" y1="145" x2="450" y2="153" stroke="#fb7185" stroke-width="1.3" opacity=".85"/><line class="fade" x1="310" y1="162" x2="450" y2="170" stroke="#fb7185" stroke-width="1.3" opacity=".85"/><line class="fade" x1="310" y1="179" x2="450" y2="187" stroke="#fb7185" stroke-width="1.3" opacity=".85"/><text x="390" y="55" font-size="12" fill="#fb7185" text-anchor="middle" font-weight="700">WHAT YOU ACTUALLY HAVE</text><text x="390" y="254" font-size="10.5" fill="#fb7185" text-anchor="middle" font-weight="600">A GRILLE. Random crosshatch.</text><text x="390" y="270" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="500">Ordinary on the Guru mount.</text><text x="390" y="288" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">It means the OPPOSITE: scattered ambition.</text></svg>