<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 450" role="img"><style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .draw { stroke-dasharray:1000; stroke-dashoffset:1000;
           animation: dash 1.6s ease-out forwards; }
  .d2 { animation-delay:.3s } .d3 { animation-delay:.6s }
  .d4 { animation-delay:.9s } .d5 { animation-delay:1.2s }
  .d6 { animation-delay:1.5s }
  @keyframes dash { to { stroke-dashoffset:0 } }
  .fade { opacity:0; animation: fade .8s ease-out 1.4s forwards }
  @keyframes fade { to { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .draw { stroke-dashoffset:0 !important; }
    .fade { opacity:1 !important; }
  }
  
</style><g transform="translate(0,0) scale(1.0)"
     stroke="#94a3b8" stroke-width="1.5" fill="#0f172a" fill-opacity=".35"
     stroke-linejoin="round">
  <rect x="90" y="140" width="180" height="230" rx="38"/>
  <rect x="100" y="55"  width="34" height="90"  rx="17"/>
  <rect x="140" y="35"  width="34" height="112" rx="17"/>
  <rect x="180" y="48"  width="34" height="99"  rx="17"/>
  <rect x="220" y="80"  width="30" height="68"  rx="15"/>
  <rect x="46"  y="200" width="32" height="104" rx="16" transform="rotate(-28 62 252)"/>
</g><path d="M100 198 C 106 252, 120 312, 152 366" fill="none" stroke="#34d399" stroke-width="3" class="draw" stroke-linecap="round"/><path d="M100 198 C 100 240, 104 288, 118 330" fill="none" stroke="#fb7185" stroke-width="2.4" class="draw d3" stroke-linecap="round" stroke-dasharray="6 4"/><ellipse class="fade" cx="128" cy="300" rx="30" ry="34" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-width="1.4"/><g class="fade"><text x="128" y="302" font-size="11" fill="#34d399" text-anchor="middle" font-weight="600">शुक्र</text><text x="128" y="315" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500">पर्वत</text><text x="300" y="250" font-size="12" fill="#34d399" text-anchor="start" font-weight="700">चौड़ा चाप</text><text x="300" y="265" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">= बड़ा शुक्र पर्वत</text><text x="300" y="278" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">= गहरी जीवन-शक्ति</text><text x="300" y="320" font-size="12" fill="#fb7185" text-anchor="start" font-weight="700">सँकरा चाप</text><text x="300" y="335" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">= अँगूठे से सटा</text><text x="300" y="348" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="500">= कम जीवन-शक्ति</text><text x="215" y="410" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="600">चाप की चौड़ाई ही पढ़ाई है।</text><text x="215" y="426" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="500">इसकी लंबाई आपकी उम्र नहीं है।</text></g></svg>