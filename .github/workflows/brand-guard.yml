name: IR Guard — auto-fix IRs + alert on violations + SEO/GEO/AEO/EEAT gaps

# 🔱 Trikaal Vaani — IR (Iron Rule) Guard  v6
# Runs on every push to main (and can be run manually from the Actions tab).
#
# ═══════════════════════════════════════════════════════════════════════════
#  v5 -> v6  (2026-08-31)  — FOUR RULES RETIRED. All four were correct when
#  written and are wrong now, because the Google Business Profile was approved
#  and the product line changed underneath them.
#
#  RETIRED 1 — AUTO-FIX  s/Delhi NCR/India/g
#    Written while the GBP was still pending, under IR-20 ("global not local").
#    IR-20 was superseded by CEO order in July 2026. The GBP is now verified
#    (Trikaal Vaani, Astrologer, Dwarka 110075) and /astrologer-{city} pages
#    are live and in the sitemap, so "Delhi NCR" is now the correct phrase and
#    this rule was silently deleting the exact regional signal local SEO needs.
#    Observed on 31 Aug 2026: a page.tsx deployed at 13:35 had its
#    areaServed AdministrativeArea "Delhi NCR" rewritten to "India" by the bot
#    12 seconds later, leaving the schema with "India" twice.
#
#    NO REVERSE RULE HAS BEEN ADDED, DELIBERATELY. s/India/Delhi NCR/g would
#    corrupt the codebase, because the bot cannot tell which "India" used to be
#    "Delhi NCR" and which was always "India". It would break, among others:
#      { '@type': 'Country', name: 'India' }   -> invalid schema
#      "Government of India MSME"              -> false Udyam claim
#      "All India", "across India", "en_IN"    -> nonsense
#    The residue this rule already left behind ("Serving India, all of India",
#    "across India, India and worldwide", "India — and Anywhere Else") is being
#    repaired BY HAND, file by file. A one-time human fix, not a standing regex.
#    An advisory scan for that residue is added in PART 3 below.
#
#  RETIRED 2 — BLOCKING  'LocalBusiness'
#    Banned under IR-20 for the same pre-GBP reason. LocalBusiness schema is now
#    REQUIRED on /astrologer-{city} and on the near-me city blog pages — it is
#    the single biggest local ranking factor available to us. Keeping this rule
#    meant every push carrying correct local schema failed the run.
#
#  RETIRED 3 — BLOCKING  'astrologer-delhi'
#    Same cause. The route is live, has been in app/sitemap.ts LOCAL_ROUTES
#    since v8.2 at priority 0.9, and is the landing page the GBP points at.
#
#  RETIRED 4 — BLOCKING  literal 499
#    Rs 499 was a phantom price when this was written. It is now a real,
#    published product: the On-Call Consultation. The strike-through check
#    ('line-through') is KEPT — a crossed-out price implying a fake discount is
#    still banned. Only the bare 499 literal is retired.
#
#  Everything else in v5 is unchanged.
# ═══════════════════════════════════════════════════════════════════════════
#
# ─────────────────────────────────────────────────────────────────────────
#  PART 1 — AUTO-FIX  (bot corrects + commits automatically; build-safe)
#     • Brand spelling : "Trikal"                         -> "Trikaal"
#     • AI vendor names : "Gemini 2.5 Pro / Claude Sonnet" -> "premium AI engine"
#     •                   "Gemini AI"                      -> "premium AI"
#     • Retired persona : "Jini"                           -> "Trikaal"
#     • False tech claim: "Prokerala API"                  -> "self-hosted Swiss Ephemeris"
#     • Broken link     : href/url "/about"               -> "/founder"
#     • Old VM IP       : "34.14.164.105"                  -> "34.47.182.227"   [v5: 2026-06-05]
#     These are mechanical text swaps — they CANNOT break the build.
#     (Location rule removed in v6 — see the retirement note above.)
#
#  PART 2 — VIOLATION ALERTS  (turns the run RED ❌; GitHub emails you on failure)
#     The bot NEVER auto-deletes these — they are structural/contextual and a
#     blind delete could corrupt the file. It prints the exact FILE:LINE so you
#     can fix by hand. Covered:
#       • Fake ratings / star reviews (aggregateRating, "4.9/5", "★★★★★", "Client Rating")
#       • Fake testimonial label ("Verified Experiences")
#       • Strike-through price anchor ("line-through")
#       • Fake counters ("10,000+ seekers", "2,400+ predictions", etc.)
#       • Real-estate credential ("real estate ... expertise / experience", "India Real Estate")
#       • Recurring monthly pricing ("/month", "per month", "₹99", "monthly plan/subscription")
#
#  PART 3 — SEO / GEO / AEO / EEAT COMPLETENESS  (⚠️ advisory, NON-blocking)
#     Scans every app/**/page.tsx and lists MISSING items per file so you can
#     ADD real content. It NEVER auto-inserts schema (IR-0: never fabricate).
#       • JSON-LD schema, FAQPage, BreadcrumbList   (AEO / rich results)
#       • canonical, openGraph                       (technical SEO)
#       • speakable                                  (GEO / voice answers)
#       • sameAs, dateModified, /founder author link (EEAT authority + freshness)
#     v6 adds: leftover damage from the retired Delhi-NCR rule.
#
#  ALWAYS PROTECTED (never touched): trikalvaani.com URLs, legalName,
#  meta-keyword alt-spellings, code identifiers (X-Trikal-Key, trikal-engines,
#  TrikalVaani, TrikalVoice), [Trikal] log tags, comment/changelog lines, and the
#  REAL API model strings (gemini-2.5-pro, claude-sonnet, GEMINI_MODEL=...).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ir-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ══ PART 1: AUTO-FIX ══════════════════════════════════════════════
      # v6: "Delhi NCR" dropped from both the file-discovery grep and the
      # substitution list. Nothing else in this step changed.
      - name: Auto-fix IRs (brand, vendor, Jini, Prokerala, about, VM IP)
        shell: bash
        run: |
          echo "IR Guard v6 — scanning & auto-fixing content IRs..."
          FILES=$(grep -rlE 'Trikal|Gemini|Claude Sonnet|Jini|Prokerala|/about"|34\.14\.164\.105' \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.html' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git . 2>/dev/null || true)
          for f in $FILES; do
            perl -i -pe '
              $skip = (m{^\s*//} || m{^\s*\*} || m{/\*}
                    || /gemini-2\.5|claude-sonnet|GEMINI_|CLAUDE_|model:\s*.gemini/
                    || /trikalvaani/i
                    || /legalName|alternateName|also (known|searched)|Sanskrit|double|transliteration|keyword/i
                    || /\[Trikal/ || /console\./
                    || /X-Trikal|Trikal-|Trikal_|_Trikal|TrikalVaani|TrikalVoice|trikal-engines/);
              unless ($skip) {
                s/Gemini[^"'"'"']{0,30}\+\s*Claude Sonnet(\s*polish)?/premium AI engine/g;
                s/Gemini\s*(Pro\s*)?2\.5(\s*Pro)?(\s*Flash)?/premium AI engine/g;
                s/Gemini AI/premium AI/g;
                s/Claude Sonnet(\s*polish)?/premium AI engine/g;
                s/Swiss Ephemeris \+ Prokerala API/Swiss Ephemeris (self-hosted)/g;
                s/ · Prokerala API//g;
                s/Prokerala API/self-hosted Swiss Ephemeris/g;
                s/\bJini\b/Trikaal/g;
                s/\bTrikal\b/Trikaal/g;
              }
              # VM IP replacement (separate block — no skip on comments/strings;
              # IP is highly specific so false-positive risk is effectively zero).
              s/34\.14\.164\.105/34.47.182.227/g;
            ' "$f"
            perl -i -pe '
              next if (m{^\s*//} || m{^\s*\*} || m{/\*});
              s{/about"}{/founder"}g;
            ' "$f"
          done

      - name: Commit auto-fixes (if any)
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "Trikaal IR Bot"
            git config user.email "ir-bot@users.noreply.github.com"
            git add -A
            git commit -m "IR Guard: auto-fix brand/vendor/Jini/Prokerala/about/VM-IP [skip ci]"
            git push
            echo "Auto-fixed IR violations and pushed the correction."
          else
            echo "All auto-fix IRs already clean."
          fi

      # ══ PART 3: SEO/GEO/AEO/EEAT COMPLETENESS (advisory; runs before the
      #    blocking gate so it always prints) ═════════════════════════════
      - name: Advisory — SEO / GEO / AEO / EEAT completeness
        shell: bash
        run: |
          echo "## 🔎 SEO / GEO / AEO / EEAT completeness (advisory — add real content, never auto-filled)" >> "$GITHUB_STEP_SUMMARY"
          PAGES=$(find app -name 'page.tsx' 2>/dev/null || true)
          ANY=0
          for p in $PAGES; do
            MISS=""
            if grep -q 'application/ld+json' "$p"; then
              grep -q 'FAQPage'        "$p" || MISS="$MISS FAQPage;"
              grep -q 'BreadcrumbList' "$p" || MISS="$MISS BreadcrumbList;"
              grep -qE 'dateModified|datePublished' "$p" || MISS="$MISS dateModified(freshness);"
              grep -q 'speakable'      "$p" || MISS="$MISS speakable(GEO/AEO);"
              if grep -qE '"@type":[[:space:]]*"(Person|Organization)"' "$p"; then
                grep -q 'sameAs' "$p" || MISS="$MISS sameAs(EEAT);"
              fi
              if grep -qE '"@type":[[:space:]]*"Person"' "$p"; then
                grep -q '/founder' "$p" || MISS="$MISS /founder-author-link;"
              fi
            else
              MISS="$MISS JSON-LD-schema;"
            fi
            grep -q 'canonical' "$p" || MISS="$MISS canonical;"
            grep -q 'openGraph' "$p" || MISS="$MISS openGraph;"
            if [ -n "$MISS" ]; then
              ANY=1
              echo "  $p  ->$MISS"
              echo "- \`$p\` —$MISS" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning file=$p::IR SEO/GEO/AEO/EEAT missing:$MISS"
            fi
          done
          if [ "$ANY" = "0" ]; then
            echo "All pages carry the full IR-0 SEO/GEO/AEO/EEAT suite."
            echo "All pages complete." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Advisory scan complete (non-blocking)."

      # ══ PART 3b (v6): LEFTOVER DAMAGE FROM THE RETIRED DELHI-NCR RULE ══
      # Advisory only, and deliberately so. These phrases are what the old
      # s/Delhi NCR/India/g left behind. They are listed for a HUMAN to fix —
      # the bot must never substitute here, because "India" is correct in most
      # places on this site and wrong only in these specific mangled phrases.
      # Delete this whole step once the repair pass is finished.
      - name: Advisory — leftover damage from retired Delhi-NCR rule
        shell: bash
        run: |
          echo "## 🩹 Delhi-NCR rule residue (advisory — fix by hand, never by regex)" >> "$GITHUB_STEP_SUMMARY"
          HITS=$(grep -rnE 'India, (all of )?India|across India, India|Serving India, all of India|India — and Anywhere|India and worldwide, India' \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.html' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git . 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "Phrases below read wrong because 'Delhi NCR' was auto-replaced with 'India':"
            echo "$HITS"
            {
              echo '```'
              echo "$HITS"
              echo '```'
              echo "Restore the intended wording by hand. Do NOT add a reverse regex."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Delhi-NCR rule residue found — fix by hand (non-blocking)."
          else
            echo "No residue found."
            echo "None found." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ══ PART 2: VIOLATION ALERTS (blocking ❌ — fix by hand) ═══════════
      - name: Alert on IR violations (fake content / strike price)
        shell: bash
        run: |
          EXCL='remov|delet|no fake|not added|intentional|❌|^\s*\*|^\s*//'
          : > /tmp/ir_found.txt
          add () {
            local label="$1"; local pat="$2"; local hits
            hits=$(grep -rnE "$pat" \
              --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.html' \
              --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git . 2>/dev/null \
              | grep -viE "$EXCL" || true)
            if [ -n "$hits" ]; then
              { echo "=== ${label} ==="; echo "$hits"; echo; } >> /tmp/ir_found.txt
            fi
          }

          add "Fake ratings / star reviews"   'aggregateRating|AggregateRating|ratingValue|reviewCount|ratingCount|[0-9]\.[0-9]\s*/\s*5|★★★|average rating|Client Rating'
          add "Fake testimonial label"        'Verified Experiences'
          add "Strike-through price anchor"   'line-through'
          add "Fake counters"                 '[0-9][0-9,]*\+?\s*(seekers|predictions|clients|consultations|readings)'
          add "Real-estate credential"        'real estate (and|background|experience|expertise)|(years|expertise|experience)[^.]{0,20}real estate|India Real Estate'
          add "Recurring monthly pricing"     '/month|per month|monthly (plan|subscription|fee|price)|₹\s*99\b'
          # v6: 'LocalBusiness', 'astrologer-delhi' and the bare 499 literal are
          # retired here — all three are now correct, required content. See the
          # retirement notes at the top of this file.

          if [ -s /tmp/ir_found.txt ]; then
            echo "❌ IR VIOLATION(S) FOUND — fix by hand (bot never auto-deletes these):"
            echo "----------------------------------------------------------------------"
            cat /tmp/ir_found.txt
            echo "----------------------------------------------------------------------"
            echo "Share just the listed file(s); these are structural and need a manual fix."
            {
              echo "## ❌ IR violations (blocking — fix by hand)"
              echo '```'
              cat /tmp/ir_found.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ No IR violations. Jai Maa Shakti 🔱"
          echo "## ✅ No IR violations" >> "$GITHUB_STEP_SUMMARY"
