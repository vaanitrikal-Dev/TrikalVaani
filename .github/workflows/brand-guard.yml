name: IR Guard — auto-fix IRs + protect against fake ratings

# 🔱 Trikaal Vaani — IR (Iron Rule) Guard  v3
# Runs on every push to main (and can be run manually from the Actions tab).
#
#  PART 1 — AUTO-FIX (bot corrects + commits automatically):
#     • Brand spelling : "Trikal"                            -> "Trikaal"
#     • Location        : "Delhi NCR"                         -> "India"
#     • AI vendor names : "Gemini 2.5 Pro / Claude Sonnet"    -> "premium AI engine"
#     •                   "Gemini AI"                         -> "premium AI"
#     • Retired persona : "Jini"                              -> "Trikaal"
#     • False tech claim: "Prokerala API"                     -> "self-hosted Swiss Ephemeris"
#     These are content-text rules — they CANNOT break the build.
#
#  PART 2 — WARN ONLY (bot turns RED + emails, never auto-changes):
#     • Fake ratings / star reviews (aggregateRating / "4.9/5" / "★★★★★" / "average rating")
#       Structural blocks — remove by hand (share just those few files).
#       NOTE: phantom ₹499 is NOT auto-handled — remove ₹499 by hand too.
#
#  ALWAYS PROTECTED (never touched): trikalvaani.com URLs, legalName,
#  meta-keyword alt-spellings, code identifiers (X-Trikal-Key, trikal-engines,
#  TrikalVaani), [Trikal] log tags, comment/changelog lines, and the REAL API
#  model strings (gemini-2.5-pro, claude-sonnet, GEMINI_MODEL=...).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ir-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── PART 1: AUTO-FIX ──────────────────────────────────────────
      - name: Auto-fix IRs (brand, location, vendor, Jini, Prokerala)
        shell: bash
        run: |
          echo "IR Guard v3 — scanning & auto-fixing content IRs..."
          FILES=$(grep -rlE 'Trikal|Delhi NCR|Gemini|Claude Sonnet|Jini|Prokerala' \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.html' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git . 2>/dev/null || true)
          for f in $FILES; do
            perl -i -pe '
              $skip = (m{^\s*//} || m{^\s*\*} || m{/\*}
                    || /gemini-2\.5|claude-sonnet|GEMINI_|CLAUDE_|model:\s*.gemini/
                    || /trikalvaani/i
                    || /legalName|alternateName|also (known|searched)|Sanskrit|double|transliteration|keyword/i
                    || /\[Trikal/ || /console\./
                    || /X-Trikal|Trikal-|Trikal_|_Trikal|TrikalVaani|TrikalVoice|trikal-engines/);
              unless ($skip) {
                s/Gemini[^"'"'"']{0,30}\+\s*Claude Sonnet(\s*polish)?/premium AI engine/g;
                s/Gemini\s*(Pro\s*)?2\.5(\s*Pro)?(\s*Flash)?/premium AI engine/g;
                s/Gemini AI/premium AI/g;
                s/Claude Sonnet(\s*polish)?/premium AI engine/g;
                s/Swiss Ephemeris \+ Prokerala API/Swiss Ephemeris (self-hosted)/g;
                s/ · Prokerala API//g;
                s/Prokerala API/self-hosted Swiss Ephemeris/g;
                s/\bJini\b/Trikaal/g;
                s/Delhi NCR/India/g;
                s/\bTrikal\b/Trikaal/g;
              }
            ' "$f"
          done

      - name: Commit auto-fixes (if any)
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "Trikaal IR Bot"
            git config user.email "ir-bot@users.noreply.github.com"
            git add -A
            git commit -m "IR Guard: auto-fix brand/location/vendor/Jini/Prokerala [skip ci]"
            git push
            echo "Auto-fixed IR violations and pushed the correction."
          else
            echo "All auto-fix IRs already clean."
          fi

      # ── PART 2: WARN on fake ratings (never auto-deleted) ─────────
      - name: Warn on fake ratings / reviews
        shell: bash
        run: |
          HITS=$(grep -rnE 'aggregateRating|AggregateRating|ratingValue|reviewCount|ratingCount|[0-9]\.[0-9]\s*/\s*5|★★★|average rating|Client Rating' \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git . 2>/dev/null \
            | grep -viE 'remov|delet|no fake|not added|intentional|❌' || true)
          if [ -n "$HITS" ]; then
            echo "FAKE RATING(S) FOUND — must be removed by hand (IR-0: no fake stats):"
            echo "----------------------------------------------------------------------"
            echo "$HITS"
            echo "----------------------------------------------------------------------"
            echo "These are structural blocks — share just these files and they'll be cleaned."
            exit 1
          fi
          echo "No fake ratings. Jai Maa Shakti"
